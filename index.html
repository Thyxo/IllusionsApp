<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>ILLUSIONS 2026</title>
  <meta name="description" content="Program for ILLUSIONS 2026 i Horsens, 15.–18. oktober 2026. Kalender, mit program, nu og næste – virker offline.">
  <meta name="theme-color" content="#160d24">
  <meta name="color-scheme" content="dark light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Illusions">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>try{var t=localStorage.getItem('illusions2026.theme');if(t&&t!=='auto')document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="stylesheet" href="css/app.css">
  <link rel="modulepreload" href="data.js">
  <link rel="modulepreload" href="js/time.js">
  <link rel="modulepreload" href="js/layout.js">
  <link rel="modulepreload" href="js/icons.js">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="topbar-row">
        <div class="brand">
          <span class="brand-name" aria-hidden="true">ILLUSIONS</span>
          <h1 class="brand-title" id="tab-title">Program</h1>
        </div>
        <div class="topbar-actions">
          <button type="button" class="icon-btn" id="btn-view" aria-label="Vis som liste"></button>
          <button type="button" class="icon-btn" id="btn-filter" aria-label="Filtre" aria-haspopup="dialog"></button>
        </div>
      </div>
      <div class="daytabs" id="daytabs" role="tablist" aria-label="Vælg dag"></div>
      <div class="chips" id="chips" hidden></div>
    </header>

    <div class="offline" id="offline" role="status" hidden>
      <svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M2.5 8.5a14 14 0 0 1 19 0M5.5 12a9.5 9.5 0 0 1 13 0M8.8 15.3a5 5 0 0 1 6.4 0"/><circle cx="12" cy="19" r="1.2" fill="currentColor" stroke="none"/><path d="M3 3l18 18"/></svg>
      <span>Offline – viser gemt program</span>
    </div>

    <main class="content" id="content" tabindex="-1">
      <div class="boot" aria-hidden="true"><span class="brand-name">ILLUSIONS</span></div>
    </main>

    <nav class="bottomnav" id="bottomnav" aria-label="Hovedmenu"></nav>
  </div>

  <div class="sheet-root" id="sheet-root" hidden>
    <div class="sheet-backdrop"></div>
    <div class="sheet" role="dialog" aria-modal="true" tabindex="-1">
      <div class="sheet-grab">
        <span class="sheet-handle" aria-hidden="true"></span>
        <button type="button" class="icon-btn sheet-close" data-act="close-sheet" aria-label="Luk">
          <svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="sheet-body"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">Programmet kræver JavaScript.</p></noscript>
</body>
</html>
